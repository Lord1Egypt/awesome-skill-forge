name: Validate Skills

on:
  push:
    paths:
      - 'skills/**'
      - 'optional-skills/**'
      - 'lord1egypt-skills/**'
      - 'tools/validate.py'
  pull_request:
    paths:
      - 'skills/**'
      - 'optional-skills/**'
      - 'lord1egypt-skills/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate all SKILL.md files
        run: python tools/validate.py

      - name: Count skills
        run: |
          built=$(find skills -name SKILL.md | wc -l)
          optional=$(find optional-skills -name SKILL.md | wc -l)
          custom=$(find lord1egypt-skills -name SKILL.md | wc -l)
          echo "Built-in: $built | Optional: $optional | Custom: $custom | Total: $((built + optional + custom))"
