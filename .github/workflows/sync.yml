name: Sync Official Skills

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3am UTC
  workflow_dispatch:
    inputs:
      type:
        description: 'Skill type to sync'
        required: false
        default: 'all'
        type: choice
        options: [all, built-in, optional]
      rebuild:
        description: 'Rebuild index after sync'
        required: false
        default: true
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync from Hermes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/sync.py \
            --type ${{ github.event.inputs.type || 'all' }} \
            ${{ github.event.inputs.rebuild == 'true' && '--rebuild' || '' }}

      - name: Build registry
        run: python tools/build_registry.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/ optional-skills/ registry.json REGISTRY.md
          git commit -m "chore: auto-sync official skills $(date +%Y-%m-%d)"
          git push
